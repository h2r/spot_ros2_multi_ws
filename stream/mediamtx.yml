# MediaMTX configuration for the GHOST scene stream.
# Unity (or tools/test_stream.sh) pushes H.264 over RTSP to :8554/scene;
# operator consoles pull it over WebRTC via WHEP at :8889/scene/whep.
# Unset options keep MediaMTX defaults.

logLevel: info

api: no
metrics: no
playback: no

rtsp: yes
rtspTransports: [tcp]
rtspAddress: :8554

rtmp: no
hls: no
srt: no
moq: no

webrtc: yes
webrtcAddress: :8889
# Plain http on the LAN — the console page is served over http too, so there's
# no mixed-content issue and operators skip the cert-trust step. For TLS,
# generate certs (gen_certs.sh) and set webrtcEncryption: yes + the two paths.
webrtcEncryption: no
webrtcLocalUDPAddress: :8189
# If cross-device video stays black, add this host's LAN IP so MediaMTX offers
# a reachable ICE candidate (replace with the server's address):
# webrtcAdditionalHosts: [128.148.138.132]

paths:
  scene:
    source: publisher
