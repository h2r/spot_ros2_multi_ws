name: spot_sandbox_gui_record

services:
  ros2_ws:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ros2_ws:humble
    container_name: ros2_ws_gui_record
    stdin_open: true
    tty: true
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=5
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - .:/ros2_ws
      - ./secrets:/root/spot_configs:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: /bin/bash
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]